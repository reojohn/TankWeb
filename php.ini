; FortressAuth PHP hardening
expose_php = Off

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = syslog

; Application does not require OS command execution or PHP source disclosure.
disable_functions = exec,system,shell_exec,passthru,popen,proc_open,show_source

session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_samesite = Strict

; FortressAuth has no upload feature.
file_uploads = Off

; Limit request/resource abuse for this small authentication application.
post_max_size = 1M
memory_limit = 128M
max_execution_time = 30
max_input_time = 30
max_input_vars = 200

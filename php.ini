; ---------------------------------
; SECURITY HARDENING — FortressAuth
; ---------------------------------

; Disable error display (never show to user)
display_errors = Off
display_startup_errors = Off

; Log errors only
log_errors = On
error_log = C:\Users\REO JOHN\OneDrive\Desktop\FortressAuth\logs\php_security.log

; Disable dangerous PHP functions
disable_functions = exec, system, shell_exec, passthru, popen, proc_open, curl_multi_exec, parse_ini_file, show_source

; Force strict session handling
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_samesite = Strict

; Disable file uploads (if not needed)
file_uploads = Off

; Disable exposing PHP version
expose_php = Off
